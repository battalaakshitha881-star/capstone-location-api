<!DOCTYPE html>
<html>
<head>
  <title>Village Data Browser</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background: #f7f9fc; }
    h1 { color: #1E2761; }
    table { border-collapse: collapse; width: 100%; background: white; }
    th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
    th { background: #028090; color: white; }
    select { padding: 6px; margin-right: 10px; }
  </style>
</head>
<body>
  <h1>Village Data Browser</h1>
  <select id="stateSelect"><option value="">Select State</option></select>
  <table id="dataTable">
    <thead><tr><th>Village</th><th>Sub-District</th><th>District</th><th>State</th></tr></thead>
    <tbody></tbody>
  </table>

  <script>
    const API_KEY = 'ak_demo1234567890abcdef1234567890ab';

    async function loadStates() {
      const res = await fetch('/v1/states', { headers: { 'X-API-Key': API_KEY } });
      const json = await res.json();
      const select = document.getElementById('stateSelect');
      json.data.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name;
        select.appendChild(opt);
      });
    }

    document.getElementById('stateSelect').addEventListener('change', async (e) => {
      const stateId = e.target.value;
      const tbody = document.querySelector('#dataTable tbody');
      tbody.innerHTML = '';
      if (!stateId) return;

      const res = await fetch('/v1/search?q=an&limit=50', { headers: { 'X-API-Key': API_KEY } });
      const json = await res.json();
      json.data.forEach(v => {
        const row = document.createElement('tr');
        row.innerHTML = `<td>${v.hierarchy.village}</td><td>${v.hierarchy.subDistrict}</td><td>${v.hierarchy.district}</td><td>${v.hierarchy.state}</td>`;
        tbody.appendChild(row);
      });
    });

    loadStates();
  </script>
</body>
</html>
